<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đặt Hàng - Firebase & Captcha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 320px;
        }
        .form-container h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .captcha-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        canvas {
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            background-color: #fff;
        }
        .btn-reload {
            background: #e0e0e0;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            height: 47px;
        }
        .btn-reload:hover {
            background: #d0d0d0;
        }
        .btn-submit {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit:hover {
            background: #218838;
        }

        /* --- CSS cho Custom Modal --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            width: 260px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .modal-box p {
            margin: 0 0 15px 0;
            font-size: 15px;
            color: #333;
        }
        .btn-close-modal {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-close-modal:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Xác Nhận Đặt Hàng</h2>
    
    <!-- Thêm ô nhập số điện thoại -->
    <div class="form-group">
        <label for="phoneInput">Số điện thoại:</label>
        <input type="tel" id="phoneInput" placeholder="Nhập số điện thoại của bạn..." autocomplete="off" />
    </div>

    <div class="form-group">
        <label for="captchaInput">Mã CAPTCHA:</label>
        <div class="captcha-box">
            <canvas id="captchaCanvas" width="140" height="45" onclick="generateCaptcha()" title="Bấm vào đây để đổi mã khác"></canvas>
            <button type="button" class="btn-reload" onclick="generateCaptcha()">🔄</button>
        </div>
        <input type="text" id="captchaInput" placeholder="Nhập 4 ký tự trong ảnh..." autocomplete="off" />
    </div>

    <button type="button" class="btn-submit" onclick="submitOrder()">Xác Nhận</button>
</div>

<!-- Custom Modal -->
<div id="customModal" class="modal-overlay">
    <div class="modal-box">
        <p id="modalMessage">Thông báo ở đây</p>
        <button class="btn-close-modal" onclick="closeModal()">Đóng</button>
    </div>
</div>

<!-- Nhúng Firebase SDK từ CDN -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Cấu hình Firebase của dự án "Japan-shop"
    const firebaseConfig = {
        apiKey: "AIzaSyDTeoMZbUF67rINsYSLKMaHMtds95PVOr8",
        authDomain: "japan-5e21f.firebaseapp.com",
        projectId: "japan-5e21f",
        storageBucket: "japan-5e21f.firebasestorage.app",
        messagingSenderId: "649326861651",
        appId: "1:649326861651:web:e96c4f6d5ed97f20d015a6",
        measurementId: "G-97RYZKLXPF"
    };

    // Khởi tạo Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentCaptchaCode = "";

    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function randomColor(min, max) {
        return `rgb(${randomInt(min, max)}, ${randomInt(min, max)}, ${randomInt(min, max)})`;
    }

    function getRandomCode(length = 4) {
        const chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz";
        let code = "";
        for (let i = 0; i < length; i++) {
            code += chars[randomInt(0, chars.length - 1)];
        }
        return code;
    }

    function generateCaptcha() {
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);

        currentCaptchaCode = getRandomCode(4);

        for (let i = 0; i < 80; i++) {
            ctx.fillStyle = randomColor(100, 200);
            ctx.beginPath();
            ctx.arc(randomInt(0, width), randomInt(0, height), Math.random() * 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        for (let i = 0; i < 6; i++) {
            ctx.strokeStyle = randomColor(80, 180);
            ctx.lineWidth = randomInt(1, 3);
            ctx.beginPath();
            ctx.moveTo(randomInt(0, width), randomInt(0, height));
            ctx.bezierCurveTo(
                randomInt(0, width), randomInt(0, height),
                randomInt(0, width), randomInt(0, height),
                randomInt(0, width), randomInt(0, height)
            );
            ctx.stroke();
        }

        for (let i = 0; i < currentCaptchaCode.length; i++) {
            const char = currentCaptchaCode[i];
            const fontSize = randomInt(26, 34);
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.fillStyle = randomColor(0, 100);

            ctx.save();
            const x = 15 + (i * 30);
            const y = randomInt(28, 38);
            ctx.translate(x, y);

            const angle = randomInt(-30, 30) * (Math.PI / 180);
            ctx.rotate(angle);

            const scaleY = Math.random() * 0.4 + 0.8;
            ctx.scale(1, scaleY);

            ctx.fillText(char, 0, 0);
            ctx.restore();
        }

        document.getElementById('captchaInput').value = '';
    }

    function showModal(message) {
        document.getElementById('modalMessage').innerText = message;
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
    }

    // Xử lý khi bấm Xác Nhận và lưu lên Firestore
    window.submitOrder = async function() {
        const phone = document.getElementById('phoneInput').value.trim();
        const userInput = document.getElementById('captchaInput').value.trim();
        
        // Kiểm tra số điện thoại
        if (!phone) {
            showModal('Vui lòng nhập số điện thoại!');
            return;
        }

        // Kiểm tra CAPTCHA
        if (!userInput) {
            showModal('Vui lòng nhập mã CAPTCHA!');
            return;
        }

        if (userInput.toLowerCase() === currentCaptchaCode.toLowerCase()) {
            try {
                // Đẩy dữ liệu số điện thoại lên collection "test_phones" trên Firestore
                await addDoc(collection(db, "test_phones"), {
                    phoneNumber: phone,
                    createdAt: new Date().toISOString()
                });

                showModal('Xác nhận thành công! Đã lưu số điện thoại lên Firebase.');
                document.getElementById('phoneInput').value = '';
                generateCaptcha();
            } catch (e) {
                console.error("Lỗi lưu dữ liệu: ", e);
                showModal('Có lỗi xảy ra khi lưu lên hệ thống!');
            }
        } else {
            showModal('Mã CAPTCHA không chính xác!');
            generateCaptcha();
        }
    };

    window.onload = generateCaptcha;
</script>

</body>
</html>
